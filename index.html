<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FirstProject - Legacy Sky</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050816;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .page {
      max-width: 980px;
      text-align: center;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-size: clamp(2.5rem, 5vw, 4rem);
    }
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .card {
      border-radius: 24px;
      overflow: hidden;
      background: #0b1124;
      box-shadow: 0 20px 80px rgba(15, 23, 42, 0.35);
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .footer {
      margin-top: 1.75rem;
      color: #64748b;
      font-size: 0.95rem;
    }
    a {
      color: #7dd3fc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Legacy Sky</h1>
    <p>这是一个新的静态首页，用于 GitHub Pages 和直接访问项目根目录。</p>
    <div class="card">
      <img src="legacy-sky.png" alt="Legacy Sky" />
    </div>
    <div class="footer">
      如果你想部署到 GitHub Pages，请确保仓库根目录包含此 `index.html` 文件。
    </div>
  </main>
</body>
</html>
