<!DOCTYPE html>
<html>

<head>
    <title>Ocean</title>

    <style>
        body{
            margin:0;
            overflow:hidden;
        }

        video{
            position:fixed;
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .title{
            position:absolute;
            top:35%;
            left:50%;
            transform:translate(-50%,-50%);
            color:white;
            font-size:60px;
            font-family:Arial;
        }
    </style>
</head>

<body>

<video
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">
    
    <source src="ocean.mp4" type="video/mp4">

</video>

<div class="title">
    EusocialLab AI
</div>

</body>
</html>
